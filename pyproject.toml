[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "complaint-review-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<4", "scikit-learn>=1.4,<2", "joblib>=1.3,<2", "streamlit>=1.38,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
include = ["cra*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
